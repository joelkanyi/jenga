name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM & Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Compiles Android + Desktop, runs apiCheck, lint, the token-usage check,
      # WCAG contrast tests and the Roborazzi goldens (cross-OS tolerant).
      - name: Verify jenga
        run: ./gradlew :jenga:check :jenga:compileKotlinDesktop --stacktrace

      - name: Verify catalog
        run: ./gradlew :catalog:assembleDebug :catalog:verifyRoborazziDebug :catalog:compileKotlinDesktop --stacktrace

      - name: Generate API docs (Dokka)
        run: ./gradlew :jenga:dokkaGenerateHtml --stacktrace

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: jenga-api-docs
          path: jenga/build/dokka/html
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports'
          if-no-files-found: ignore

  apple:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native toolchain + dependencies are large; cache them across runs.
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile iOS targets
        run: ./gradlew :jenga:compileKotlinIosSimulatorArm64 :jenga:compileKotlinIosArm64 :catalog:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Build AND launch on a simulator. xcodebuild alone only compiles/links, so it
      # misses runtime failures (e.g. the Compose PlistSanityCheck abort). This boots
      # a sim, installs, launches, and asserts the app is still alive.
      - name: Build & smoke-test iOS sample on simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          cd catalog/iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build/ddata -destination "id=$UDID" ARCHS=arm64 build
          xcrun simctl install "$UDID" build/ddata/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" io.github.joelkanyi.jenga.catalog
          sleep 8
          if xcrun simctl spawn "$UDID" launchctl list | grep -q io.github.joelkanyi.jenga.catalog; then
            echo "iOS sample launched and is running (no crash)."
          else
            echo "::error::iOS sample crashed on launch."
            exit 1
          fi
