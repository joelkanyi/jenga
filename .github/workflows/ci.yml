name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM & Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify jenga
        run: ./gradlew :jenga:check :jenga:compileKotlinDesktop --stacktrace

      - name: Verify catalog
        run: ./gradlew :catalog:assembleDebug :catalog:verifyRoborazziDebug :catalog:compileKotlinDesktop --stacktrace

      - name: Generate API docs (Dokka)
        run: ./gradlew :jenga:dokkaGenerateHtml --stacktrace

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: jenga-api-docs
          path: jenga/build/dokka/html
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports'
          if-no-files-found: ignore

  # iOS COMPILE + LINK. macos-26 is required (Compose MP 1.11 builds the iOS
  # framework against the iOS 26 SDK; macos-latest / Xcode 16 is too old).
  # Runs ONLY on push to main, never on PRs, to cut metered macOS to the minimum.
  apple-compile:
    name: iOS (compile + link)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile & link iOS targets
        run: >-
          ./gradlew
          :jenga:compileKotlinIosSimulatorArm64
          :catalog:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

  # The FULL simulator boot + install + launch smoke test is the slow, fragile,
  # expensive part (and the source of the recent failed runs). It runs only on
  # main pushes and on-demand, NOT on every PR. This is the biggest macOS saver.
  apple-smoke:
    name: iOS (simulator smoke test)
    if: github.event_name != 'pull_request'
    needs: apple-compile
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build & smoke-test iOS sample on simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          cd catalog/iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build/ddata -destination "id=$UDID" ARCHS=arm64 build
          xcrun simctl install "$UDID" build/ddata/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" io.github.joelkanyi.jenga.catalog
          sleep 8
          # Capture the process list first, then test it. Piping straight into
          # `grep -q` makes grep close the pipe on the first match, which kills
          # `launchctl` with SIGPIPE; under `pipefail` that turns a running app
          # into a false "crashed on launch". `|| true` keeps `set -e` happy
          # when there is genuinely no match.
          STATE=$(xcrun simctl spawn "$UDID" launchctl list | grep io.github.joelkanyi.jenga.catalog || true)
          if [ -n "$STATE" ]; then
            echo "iOS sample launched and is running (no crash): $STATE"
          else
            echo "::error::iOS sample crashed on launch."
            exit 1
          fi
