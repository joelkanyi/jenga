name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM & Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Compiles Android + Desktop, runs apiCheck, lint, the token-usage check,
      # WCAG contrast tests and the Roborazzi goldens (cross-OS tolerant).
      - name: Verify jenga
        run: ./gradlew :jenga:check :jenga:compileKotlinDesktop --stacktrace

      - name: Verify catalog
        run: ./gradlew :catalog:assembleDebug :catalog:verifyRoborazziDebug :catalog:compileKotlinDesktop --stacktrace

      - name: Generate API docs (Dokka)
        run: ./gradlew :jenga:dokkaGenerateHtml --stacktrace

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: jenga-api-docs
          path: jenga/build/dokka/html
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports'
          if-no-files-found: ignore

  apple:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native toolchain + dependencies are large; cache them across runs.
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile iOS targets
        run: ./gradlew :jenga:compileKotlinIosSimulatorArm64 :jenga:compileKotlinIosArm64 :catalog:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS sample (simulator)
        run: |
          cd catalog/iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' build
