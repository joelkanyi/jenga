version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compose-and-kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
